# Two variants that share a name and little else, which is what the data layout says:
# `base` is a GUI task (read a code off the screen), `json_kv` is a file-writing task.
# Each carries its own bundle, so each declares its own assets.

resources: { cpus: 2, memory_mb: 2048 }
network: { mode: block }
timeouts: { setup: 120, agent: 900, verify: 120 }

image: sandbox-base-cli
setup: { assets: [demo_hello_json_kv] }
verify: { assets: [demo_hello_json_kv_reference] }

variants:
  - name: json_kv # runnable with a file-only agent
  - name: base # GUI: needs the desktop image and desktop tools
    image: sandbox-base-gui
    harness_family: policy
    setup: { assets: [demo_hello_base] }
    verify: { assets: [demo_hello_base_reference] }

validate: { min_reward: 1.0 }
metadata:
  tags: [smoke]
  ported_from: tasks/demo/hello (cua_bench format)
