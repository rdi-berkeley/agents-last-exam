<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="430" fill="#f7f8fa"/>

  <text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a">No rules are given. Only behaviour.</text>
  <text x="24" y="55" font-size="12.5" fill="#5b6673">The reference engine never reaches the VM, so there is nothing on the machine to call instead of implementing.</text>

  <!-- reference, host only -->
  <rect x="24" y="80" width="250" height="118" rx="4" fill="#fff" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="40" y="102" font-size="12.5" font-weight="700" fill="#b91c1c">REFERENCE, host only</text>
  <text x="40" y="122" font-size="11.5" fill="#334155">pkmn/engine, cartridge mode</text>
  <text x="40" y="139" font-size="11.5" fill="#334155">pinned at 78dc891</text>
  <text x="40" y="156" font-size="11.5" fill="#334155">held-out transcripts</text>
  <text x="40" y="176" font-size="10.5" fill="#94a3b8">the binary is never staged: a</text>
  <text x="40" y="189" font-size="10.5" fill="#94a3b8">submission cannot shell out to it</text>

  <!-- generated corpus -->
  <text x="307" y="124" font-size="11" fill="#5b6673" text-anchor="middle">generates</text>
  <line x1="274" y1="132" x2="336" y2="132" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#g)"/>

  <rect x="340" y="80" width="245" height="118" rx="4" fill="#fff" stroke="#b45309"/>
  <text x="356" y="102" font-size="12.5" font-weight="700" fill="#b45309">visible corpus (on the VM)</text>
  <text x="356" y="122" font-size="11.5" fill="#334155">186 scenarios, 48 families</text>
  <text x="356" y="139" font-size="11.5" fill="#334155">roll tapes, starting states,</text>
  <text x="356" y="156" font-size="11.5" fill="#334155">choices, protocol logs</text>
  <text x="356" y="176" font-size="10.5" fill="#94a3b8">plus the engine's own format dumps:</text>
  <text x="356" y="189" font-size="10.5" fill="#94a3b8">what events exist, not when they fire</text>

  <line x1="585" y1="139" x2="646" y2="139" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#g)"/>
  <rect x="650" y="80" width="226" height="118" rx="4" fill="#fff" stroke="#b45309"/>
  <text x="666" y="102" font-size="12.5" font-weight="700" fill="#b45309">agent</text>
  <text x="666" y="122" font-size="11.5" fill="#334155">infer the rules from examples:</text>
  <text x="666" y="139" font-size="11.5" fill="#334155">damage, crit, turn order, and</text>
  <text x="666" y="156" font-size="11.5" fill="#334155">how the roll tape is consumed</text>
  <text x="666" y="176" font-size="11.5" fill="#334155">write output/engine.py</text>

  <!-- grading -->
  <path d="M 763 198 L 763 224 L 450 224 L 450 250" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#g)"/>
  <rect x="255" y="252" width="390" height="70" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="271" y="274" font-size="12.5" font-weight="700" fill="#2563eb">graded on 92 held-out scenarios</text>
  <text x="271" y="294" font-size="11.5" fill="#334155">same mechanics, different roll tapes</text>
  <text x="271" y="310" font-size="11.5" fill="#334155">exact comparison: protocol log and final state</text>

  <!-- two outputs -->
  <rect x="60" y="344" width="360" height="62" rx="4" fill="#fff" stroke="#d7dee7"/>
  <text x="76" y="365" font-size="12" font-weight="700" fill="#0f172a">mechanics</text>
  <text x="76" y="383" font-size="11.5" fill="#334155">fraction of the 48 move families reproduced.</text>
  <text x="76" y="398" font-size="11.5" fill="#334155">Names which mechanic is broken.</text>

  <rect x="450" y="344" width="390" height="62" rx="4" fill="#fff" stroke="#d7dee7"/>
  <text x="466" y="365" font-size="12" font-weight="700" fill="#0f172a">full pass</text>
  <text x="466" y="383" font-size="11.5" fill="#334155">every held-out scenario exact, or zero.</text>
  <text x="466" y="398" font-size="11.5" fill="#334155">An engine is bit-exact or it is not.</text>
  <line x1="330" y1="322" x2="250" y2="340" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#g)"/>
  <line x1="560" y1="322" x2="630" y2="340" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#g)"/>

  <defs>
    <marker id="g" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
