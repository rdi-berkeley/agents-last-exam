# Docker provider for the cpu-free-ubuntu (Linux, no-GPU) tasks —
# boots the versioned `agentslastexam/ale-ubuntu22-docker:v1.1` image as a
# local container instead of one GCE VM per task.
#
# Per-task cpus/memory are derived from the task card's GCE machine type by the
# provider (c4-standard-4 -> 4 CPU / 15g, etc.); `resolution` sets the Xvfb size.
#
# This profile intentionally stays a simple rootless-Docker path. Four tasks
# require Docker inside the sandbox, two require Apptainer/Singularity, and
# G-code, Road and inner-support require additional namespaces or systemd/cgroups.
# Use the QEMU/KVM provider for these nine tasks inside a complete Ubuntu guest.
# Opt-in DinD hooks remain available for custom
# development setups through `enable_dind: true` + `privileged: true`, but they
# are outside the supported `docker_support.txt` profile.
snapshots:
  cpu-free-ubuntu:
    provider: docker
    image: ale-ubuntu22-docker-v1-1
    docker:
      shm_size: 2g
      resolution: [1024, 768]
task_data_source: local:task-data-v1.1
output_path: null
# output_path: local          # uncomment to fetch each run's output back to the host
gcs_sa_key: secret/gcp_key.json
