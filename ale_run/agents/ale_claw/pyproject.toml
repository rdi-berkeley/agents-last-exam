[project]
name = "ale-claw"
version = "0.1.0"
description = "Computer-use agent for local and remote CUA sandboxes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "cua-bench==0.2.7",
    "cua-agent==0.7.38",
    "cua-computer==0.5.17",
    "cua-core==0.1.18",
    # litellm + Pillow + typing_extensions are transitive via cua-agent
    # but pin them explicitly so a cua-agent bump can't silently strip them.
    "litellm>=1.80",
    "tenacity",  # Required by LiteLLM for async provider retries.
    "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ale-claw = "ale_claw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ale_claw"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/LICENSE", "/README.md", "/pyproject.toml"]
