# Task data, pinned to a dataset commit.
#
# Commits are immutable, so a recorded revision is something a later run can reproduce —
# unlike a bucket path, whose contents can change underneath an old result.
#
# Visibility travels with the data: a component marked `verify` is materialised only
# during scoring, whatever destination a task gives it.

repo: agents-last-exam/ale-tasks-assets
revision: 1d0d026c7a21226f619b74f3912e23573c7105ab

components:
  demo_hello_base_input:
    path: demo/hello/base/input
    visibility: setup
  demo_hello_base_software:
    path: demo/hello/base/software
    visibility: setup
  demo_hello_base_reference:
    path: demo/hello/base/reference
    visibility: verify

  demo_hello_json_kv_input:
    path: demo/hello/json_kv/input
    visibility: setup
  demo_hello_json_kv_reference:
    path: demo/hello/json_kv/reference
    visibility: verify
