# Task data, pinned by bucket and revision.
#
# Visibility travels with the data rather than with the task, and it is enforced
# centrally: a component marked `verify` cannot be staged before the agent runs, no
# matter which stage a task lists it under. The `reference/` directory inside these
# bundles holds gold answers, which is exactly why that rule exists.

repo: gs://ale-data-public
revision: "2026-06-06" # bucket has no immutable revisions yet; see note below

components:
  demo_hello_base:
    path: demo/hello/base
    visibility: setup
  demo_hello_base_reference:
    path: demo/hello/base
    visibility: verify
  demo_hello_json_kv:
    path: demo/hello/json_kv
    visibility: setup
  demo_hello_json_kv_reference:
    path: demo/hello/json_kv
    visibility: verify
# NOTE: a bundle currently carries input/, software/ and reference/ together, so a
# component is declared twice — once for the agent-visible half, once for scoring. The
# staging code only projects reference/ during verification, so the split is enforced
# rather than trusted. Splitting the bundles in the bucket would remove the duplication.
